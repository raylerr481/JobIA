name: JobIA backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - name: Import application
        run: python -c "from app.main import app; assert app.title == 'JobIA Backend'"
      - name: Smoke test API, persistence, delegated execution, and filters
        run: |
          python - <<'PY'
          import os
          import tempfile
          import asyncio
          import httpx

          with tempfile.TemporaryDirectory() as tmp:
              os.environ['JOBIA_DB_PATH'] = os.path.join(tmp, 'jobia.sqlite3')
              from app.main import app

              async def delegate(client, message, conversation_id):
                  response = await client.post('/api/v1/capabilities/delegate', json={
                      'contract': 'jobia-v1',
                      'capability': 'jobia',
                      'message': message,
                      'conversation_id': conversation_id,
                      'source': 'bitey-web',
                      'mode': 'specialized'
                  }, follow_redirects=True)
                  print('DELEGATION_STATUS=', response.status_code)
                  print('DELEGATION_BODY=', response.text)
                  assert response.status_code == 200
                  body = response.json()
                  assert body['delegated'] is True
                  assert body['execution_status'] == 'completed'
                  assert body['result_type'] == 'opportunities'
                  assert body['result']['count'] >= 1
                  assert body['result']['jobs']
                  return body

              async def main():
                  transport = httpx.ASGITransport(app=app)
                  async with httpx.AsyncClient(transport=transport, base_url='http://test') as client:
                      health = await client.get('/health')
                      assert health.status_code == 200
                      assert health.json()['persistence'] == 'sqlite'
                      assert health.json()['version'] == '1.4.0'

                      profile = {
                          'email': 'ci@example.com',
                          'profession': 'IT',
                          'mode': 'Remote',
                          'aiOpportunities': True,
                          'skills': ['Python', 'Networking']
                      }
                      saved = await client.put('/profile', json=profile)
                      assert saved.status_code == 200
                      loaded = await client.get('/profile?email=ci%40example.com')
                      assert loaded.status_code == 200
                      assert loaded.json()['skills'] == ['Python', 'Networking']

                      remote = await delegate(client, 'búscame trabajo remoto', 'ci-remote')
                      assert remote['result']['filters']['modality'] == 'Remote'
                      assert all(job['modality'] == 'Remote' for job in remote['result']['jobs'])

                      python_jobs = await delegate(client, 'busca trabajos de Python', 'ci-python')
                      assert 'Python' in python_jobs['result']['filters']['skills']
                      assert all('Python' in job['skills'] for job in python_jobs['result']['jobs'])

                      python_remote = await delegate(client, 'busca trabajos de Python remoto', 'ci-python-remote')
                      assert python_remote['result']['filters']['modality'] == 'Remote'
                      assert 'Python' in python_remote['result']['filters']['skills']
                      assert all(job['modality'] == 'Remote' for job in python_remote['result']['jobs'])
                      assert all('Python' in job['skills'] for job in python_remote['result']['jobs'])

                      matching = await client.post('/api/v1/capabilities/delegate', json={
                          'contract': 'jobia-v1',
                          'capability': 'jobia',
                          'message': 'qué trabajo encaja conmigo',
                          'conversation_id': 'ci-matching',
                          'source': 'bitey-web',
                          'mode': 'specialized'
                      })
                      assert matching.status_code == 200
                      matching_body = matching.json()
                      assert matching_body['execution_status'] == 'needs_input'
                      assert matching_body['result_type'] == 'matching'
                      assert 'profile.skills' in matching_body['result']['required']

                      application = await client.post('/api/v1/capabilities/delegate', json={
                          'contract': 'jobia-v1',
                          'capability': 'jobia',
                          'message': 'mejora mi CV para jobia-1',
                          'conversation_id': 'ci-application',
                          'source': 'bitey-web',
                          'mode': 'specialized'
                      })
                      assert application.status_code == 200
                      application_body = application.json()
                      assert application_body['execution_status'] == 'needs_input'
                      assert application_body['result_type'] == 'application'
                      assert application_body['result']['job_id'] == 'jobia-1'
                      assert 'profile' in application_body['result']['required']

              asyncio.run(main())
          PY
