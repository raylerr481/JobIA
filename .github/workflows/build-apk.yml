name: Build JobIA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile production-apk --non-interactive --wait

      - name: Save build metadata
        run: eas build:list --platform android --limit 1 --json > jobia-build.json

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: jobia-build-metadata
          path: jobia-build.json
